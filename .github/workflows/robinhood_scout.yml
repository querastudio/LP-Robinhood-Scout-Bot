name: LP Scout Robinhood

# Mode sekali jalan: tiap tick memproses perintah Telegram, lalu scan bila sudah
# SCAN_MINUTES sejak scan terakhir. cron-job.org dapat memicu workflow_dispatch
# (lebih andal daripada schedule: GitHub sering men-drop cron 5 menit).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: lp-scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: lp-scout-${{ github.run_id }}
          restore-keys: lp-scout-
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID:  ${{ secrets.TELEGRAM_OWNER_ID }}
          RPC_URL:            ${{ secrets.RPC_URL }}
          ALCHEMY_API_KEY:    ${{ secrets.ALCHEMY_API_KEY }}
          V4_POOL_MANAGER:    ${{ vars.V4_POOL_MANAGER }}
          SCAN_MINUTES:       ${{ vars.SCAN_MINUTES }}
        run: python main.py
